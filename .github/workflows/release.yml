name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/MusicFolderTimeFitter.Tests/MusicFolderTimeFitter.Tests.csproj --configuration Release --verbosity normal

      - name: Publish
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          dotnet publish src/MusicFolderTimeFitter -p:PublishProfile=win-x64-self-contained -p:Version=$ver
          dotnet publish src/MusicFolderTimeFitter -p:PublishProfile=win-x64-framework-dependent -p:Version=$ver

          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "src/MusicFolderTimeFitter/bin/publish/win-x64-self-contained/MusicFolderTimeFitter.exe" "dist/MusicFolderTimeFitter-$tag-win-x64.exe"
          Copy-Item "src/MusicFolderTimeFitter/bin/publish/win-x64-framework-dependent/MusicFolderTimeFitter.exe" "dist/MusicFolderTimeFitter-$tag-win-x64-fdd.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            | ファイル | 形態 | 実行要件 |
            |---|---|---|
            | `MusicFolderTimeFitter-${{ github.ref_name }}-win-x64.exe` | 自己完結型（ランタイム同梱） | なし（Windows x64） |
            | `MusicFolderTimeFitter-${{ github.ref_name }}-win-x64-fdd.exe` | フレームワーク依存型 | .NET 10 デスクトップランタイム |
