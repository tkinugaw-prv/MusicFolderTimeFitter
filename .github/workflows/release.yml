name: Release

# Action はコミット SHA で固定する（末尾のコメントが対応するバージョン）。
# 可変タグ（@v5 等）は同じ参照のまま中身が差し替わりうるため、公開リポジトリでは
# サプライチェーン対策として SHA を使う。このワークフローは contents: write を
# 持つため特に重要。更新時はコメントのバージョンも直すこと。

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/MusicFolderTimeFitter.Tests/MusicFolderTimeFitter.Tests.csproj --configuration Release --verbosity normal

      - name: Publish
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          dotnet publish src/MusicFolderTimeFitter -p:PublishProfile=win-x64-self-contained -p:Version=$ver
          dotnet publish src/MusicFolderTimeFitter -p:PublishProfile=win-x64-framework-dependent -p:Version=$ver

          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "src/MusicFolderTimeFitter/bin/publish/win-x64-self-contained/MusicFolderTimeFitter.exe" "dist/MusicFolderTimeFitter-$tag-win-x64.exe"
          Copy-Item "src/MusicFolderTimeFitter/bin/publish/win-x64-framework-dependent/MusicFolderTimeFitter.exe" "dist/MusicFolderTimeFitter-$tag-win-x64-fdd.exe"

          # exe に同梱する第三者コンポーネント（TagLibSharp は LGPL-2.1）の告知は
          # 配布物に添付する必要がある。Release の資産として exe と一緒に置く。
          # LICENSE は拡張子を付けて Windows でそのまま開けるようにする。
          Copy-Item "THIRD-PARTY-NOTICES.md" "dist/THIRD-PARTY-NOTICES.md"
          Copy-Item "LICENSE" "dist/LICENSE.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            | ファイル | 形態 | 実行要件 |
            |---|---|---|
            | `MusicFolderTimeFitter-${{ github.ref_name }}-win-x64.exe` | 自己完結型（ランタイム同梱） | なし（Windows x64） |
            | `MusicFolderTimeFitter-${{ github.ref_name }}-win-x64-fdd.exe` | フレームワーク依存型 | .NET 10 デスクトップランタイム |

            本体は MIT License（`LICENSE.txt`）。exe に同梱される第三者コンポーネントの著作権表示とライセンス全文は `THIRD-PARTY-NOTICES.md` を参照してください。
