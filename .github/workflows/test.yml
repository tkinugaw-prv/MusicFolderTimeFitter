name: Test

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/MusicFolderTimeFitter.Tests/MusicFolderTimeFitter.Tests.csproj

      - name: Test
        run: dotnet test tests/MusicFolderTimeFitter.Tests/MusicFolderTimeFitter.Tests.csproj --configuration Release --no-restore --verbosity normal
